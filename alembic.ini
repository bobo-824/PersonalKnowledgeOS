[alembic]
script_location = migrations
prepend_sys_path = .
# Required by Alembic 1.20+: without it Alembic warns and falls back to legacy
# splitting of prepend_sys_path on spaces/commas/colons.
path_separator = os
version_path_separator = os

# NOTE: Alembic reads this file with the OS *locale* encoding (GBK on Chinese
# Windows), NOT UTF-8. Keep this file ASCII-only or it will crash with
# UnicodeDecodeError. Human-facing docs live in docs/DATA_MODEL.md instead.
#
# sqlalchemy.url is intentionally left empty: migrations/env.py resolves it
# from backend.config so paths and credentials stay in one place.
# Tests redirect it by setting PKOS_DATA_DIR to a temporary directory.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
